---
postgresql_packages:
  - postgresql
  - postgresql-server
  - php8-pgsql
postgresql_data_dir: /var/lib/pgsql/data
postgresql_listen_addresses: "*"
# Cambiar al CIDR de la red privada de las dos VM. No usar 0.0.0.0/0.
postgresql_allowed_cidr: 192.168.0.0/16
postgresql_app_user: appuser_pg
postgresql_app_database: appdb_pg
postgresql_ssl_days: 3650
