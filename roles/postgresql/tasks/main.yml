
---
- name: Instalar PostgreSQL y controlador PHP
  community.general.zypper:
    name: "{{ postgresql_packages }}"
    state: present

- name: Comprobar si PostgreSQL ya fue inicializado
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: pg_initialized

- name: Inicializar clúster PostgreSQL por primera vez
  ansible.builtin.command:
    argv:
      - /usr/lib/postgresql18/bin/initdb
      - -D
      - "{{ postgresql_data_dir }}"
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  become_user: postgres
  when: not pg_initialized.stat.exists

- name: Generar certificado TLS autofirmado si no existe
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -x509
      - -days
      - "{{ postgresql_ssl_days | string }}"
      - -nodes
      - -out
      - "{{ postgresql_data_dir }}/server.crt"
      - -keyout
      - "{{ postgresql_data_dir }}/server.key"
      - -subj
      - "/CN={{ inventory_hostname }}"
    creates: "{{ postgresql_data_dir }}/server.crt"
  notify: Reiniciar postgresql

- name: Proteger clave privada TLS
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"

- name: Asegurar propietario de certificado TLS
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/server.crt"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Configurar postgresql.conf para conexiones TLS remotas
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_data_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reiniciar postgresql

- name: Configurar pg_hba.conf para autenticación cifrada
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reiniciar postgresql

- name: Habilitar e iniciar PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Aplicar configuración pendiente de PostgreSQL
  ansible.builtin.meta: flush_handlers

- name: Establecer contraseña del usuario administrativo postgres
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -d
      - postgres
      - -c
      - "ALTER ROLE postgres PASSWORD '{{ vault_postgresql_root_password | replace(\"'\", \"''\") }}';"
  changed_when: false
  no_log: true

- name: Crear usuario de aplicación PostgreSQL si no existe
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ postgresql_app_user }}') THEN CREATE ROLE {{ postgresql_app_user }} LOGIN; END IF; END $$;"
  changed_when: false

- name: Establecer contraseña del usuario de aplicación PostgreSQL
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -d
      - postgres
      - -c
      - "ALTER ROLE {{ postgresql_app_user }} PASSWORD '{{ vault_postgresql_app_password | replace(\"'\", \"''\") }}';"
  changed_when: false
  no_log: true

- name: Crear base de datos PostgreSQL si no existe
  become_user: postgres
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ postgresql_app_user }}"
      - "{{ postgresql_app_database }}"
  register: pg_createdb
  changed_when: pg_createdb.rc == 0
  failed_when: pg_createdb.rc != 0 and 'already exists' not in (pg_createdb.stderr | default(''))

- name: Comprobar si firewalld está activo
  ansible.builtin.command: systemctl is-active firewalld
  register: pg_fw
  changed_when: false
  failed_when: false

- name: Permitir puerto TCP 5432 en el firewall si está activo
  ansible.builtin.command: firewall-cmd --permanent --add-port=5432/tcp
  register: pg_fw_rule
  changed_when: pg_fw_rule.rc == 0 and 'ALREADY_ENABLED' not in (pg_fw_rule.stderr | default(''))
  failed_when: pg_fw_rule.rc != 0 and 'ALREADY_ENABLED' not in (pg_fw_rule.stderr | default(''))
  when: pg_fw.stdout == 'active'
  notify: Recargar firewall PostgreSQL

