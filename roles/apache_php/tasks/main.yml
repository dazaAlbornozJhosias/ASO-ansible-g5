---
- name: Instalar Apache y PHP
  community.general.zypper:
    name: "{{ apache_php_packages }}"
    state: present

- name: Habilitar e iniciar Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Comprobar si firewalld esta activo
  ansible.builtin.command: systemctl is-active firewalld
  register: apache_fw
  changed_when: false
  failed_when: false

- name: Comprobar si http ya esta permitido
  ansible.builtin.command: firewall-cmd --permanent --query-service=http
  register: apache_fw_http
  changed_when: false
  failed_when: false
  when: apache_fw.stdout == 'active'

- name: Permitir http en el firewall
  ansible.builtin.command: firewall-cmd --permanent --add-service=http
  when: apache_fw.stdout == 'active' and apache_fw_http.rc != 0
  notify: Recargar firewall
