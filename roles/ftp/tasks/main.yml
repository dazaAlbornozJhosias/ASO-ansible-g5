---
- name: Instalar vsftpd
  community.general.zypper:
    name: "{{ ftp_packages }}"
    state: present

- name: Crear usuario local para FTP
  ansible.builtin.user:
    name: "{{ ftp_user }}"
    shell: /bin/bash
    create_home: true
    password: "{{ vault_ftp_password | password_hash('sha512') }}"
    update_password: on_create
    state: present
  no_log: true

- name: Crear directorio FTP
  ansible.builtin.file:
    path: "{{ ftp_root }}"
    state: directory
    owner: "{{ ftp_user }}"
    group: "{{ ftp_user }}"
    mode: "0775"

- name: Desplegar configuración vsftpd
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reiniciar vsftpd

- name: Habilitar e iniciar vsftpd
  ansible.builtin.service:
    name: vsftpd
    state: started
    enabled: true

- name: Comprobar si firewalld está activo
  ansible.builtin.command: systemctl is-active firewalld
  register: ftp_fw
  changed_when: false
  failed_when: false

- name: Permitir FTP y puertos pasivos en firewalld
  ansible.builtin.command: "{{ item }}"
  loop:
    - firewall-cmd --permanent --add-service=ftp
    - "firewall-cmd --permanent --add-port={{ ftp_passive_min_port }}-{{ ftp_passive_max_port }}/tcp"
  register: ftp_fw_changes
  changed_when: "'success' in (ftp_fw_changes.stdout | default(''))"
  when: ftp_fw.stdout == 'active'
  notify: Recargar firewall FTP
