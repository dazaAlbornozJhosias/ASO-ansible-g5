---
- name: Task 3 - Deploy LAMP/Samba
  hosts: destinos
  gather_facts: false

  pre_tasks:
    - name: Evitar bloqueo de zypper por PackageKit
      ansible.builtin.systemd:
        name: packagekit
        state: stopped
        masked: true
      failed_when: false
      tags: [always]

  roles:
    - { role: apache_php, tags: [apache, lamp] }
    - { role: mariadb,    tags: [mariadb, lamp] }
    - { role: phpmyadmin, tags: [phpmyadmin, lamp] }
    - { role: samba,      tags: [samba] }
    - { role: vsftpd,     tags: [vsftpd] }
    - { role: postgresql, tags: [postgresql] }
